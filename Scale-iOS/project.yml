name: Scale
options:
  bundleIdPrefix: local.chrimatte
  deploymentTarget:
    iOS: '26.5'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: Scale uses Bluetooth to read your Renpho scale.
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '4'
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  Scale:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.chrimatte.scale.iphone
  ScaleTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Scale
  ScaleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Scale
schemes:
  Scale:
    build:
      targets:
        Scale: all
    test:
      targets: [ScaleTests, ScaleUITests]
